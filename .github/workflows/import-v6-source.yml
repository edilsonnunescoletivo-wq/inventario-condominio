name: Import v6 source

on:
  push:
    branches:
      - upload-v6-planos
    paths:
      - '.upload/trigger.txt'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: upload-v6-planos
          fetch-depth: 0

      - name: Rebuild source archive
        shell: bash
        run: |
          cat .upload/part-* > /tmp/bigfiles.b64
          base64 --decode /tmp/bigfiles.b64 > /tmp/bigfiles.tar.gz
          tar -xzf /tmp/bigfiles.tar.gz -C .
          rm -rf .upload

      - name: Commit imported source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: importar arquivos principais da versão v6 com planos comerciais"
          git push origin HEAD:upload-v6-planos
